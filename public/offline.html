<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline — Vero</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f4ec;
        color: #262620;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 360px;
      }
      svg {
        display: block;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        font-size: 0.9rem;
        color: #6b6558;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 12px;
        background: #454a34;
        color: #f7f4ec;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 10px 20px;
        cursor: pointer;
      }
      button:hover {
        background: #2e321f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg width="48" height="48" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <rect width="40" height="40" rx="12" fill="#454a34" />
        <path
          d="M11 13l9 15 9-15"
          stroke="#f7f4ec"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
        />
        <circle cx="29.5" cy="12.5" r="2.5" fill="#ff6b4a" />
      </svg>
      <h1>Sem conexão agora</h1>
      <p>
        Parece que você está offline. Assim que a internet voltar, é só tentar de
        novo pra continuar de onde parou.
      </p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
